# --enable-native-access=ALL-UNNAMED 是给 Gradle 自己用的:它要加载随包带的本地库
# (native-platform),而 JDK 21.0.11 / 24+ 会把这件事报成三条 WARNING:
#   "A restricted method in java.lang.System has been called … System::load"
# 只是提示,不影响构建,但每次构建都刷一屏。显式开一下就没这行噪音了。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这台机器上 Kotlin 增量编译缓存在写回时打不开(.tab 文件 mmap 失败),
# 报 "Could not close incremental caches"。关掉增量编译绕开它,只影响构建速度。
kotlin.incremental=false
