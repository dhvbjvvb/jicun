name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.gradle(依赖 + wrapper 发行包,后者一个就有 200MB)。
          # 依赖文件按 **/gradle-wrapper.properties 认,这个文件是进库的。
          # 首跑仍然要下全套,之后那步 apk 构建能从几分钟掉到几十秒。
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # lib/secrets.dart is gitignored, and the app does not compile without it.
      # The template is enough here: the tests stub the network, and no real
      # key is needed.
      - run: cp lib/secrets.example.dart lib/secrets.dart

      - run: flutter pub get
      - run: flutter analyze

      # 格式门。dart format 只动空白,所以它的价值不在"代码好不好看",而在不让 diff 漂:
      # 谁提交前忘了跑,下一个人的改动里就会混进一堆无关折行,review 时分不清哪行是
      # 真改动。命令与本机一致,本地跑法:dart format lib test
      # 整个仓库一次性对齐后才有这道门 —— 之前逐文件改 bug 时,顺手带进来的折行会
      # 混在同一个 diff 里。
      - name: dart format(格式门)
        run: dart format --output=none --set-exit-if-changed lib test

      # 下载器的纯逻辑测试向量是生成物(tool/download_logic_vectors.json)。
      # 这里不 --write,只校验它和实现一致 —— 改了那几个函数忘了重新生成,CI 直接红。
      - run: python3 tool/gen_logic_vectors.py

      # 注释里点名的函数改名/删了,只有这个脚本会红 —— 测试与 analyzer 都不会。
      # 判据刻意保守:只认像代码标识符的反引号词,外部名记在脚本的 FOREIGN 表里。
      - run: python3 tool/check_comment_refs.py

      # **逐文件跑**。原因见 README「为什么要逐文件跑」:Windows 上的
      # flutter_tester 有一条引擎级缺陷(ShaderMask + 滚动,0xc0000005),会静默杀掉
      # 整个测试进程、一次带走同一文件剩下的几十条用例。崩的是 Windows 版 tester,
      # CI 跑 Linux 理论上不受影响 —— 但**本机与 CI 用同一套跑法**才不会出现"本地红、
      # CI 绿"这种没法归因的情况;逐文件还顺带把爆炸半径限制在一个文件里。
      # 改测试或跑验证时,本机用等价的 .\tool\run_tests.ps1。
      #
      # **只在 tester 崩了时重试一次**。断言/异常失败不重试:重试一次会“偶尔挂一次”
      # 的真 bug 抹成绿色。判据与本机脚本 [Test-RunnerCrashed] 一致。
      - name: flutter test(逐文件;只在 tester 崩溃时重试一次)
        run: |
          set -uo pipefail
          fail=0

          # 副作用式命令替掉函数返回值:有失败标记 = 真失败;否则 = 崩了。
          #
          # 判据看**有没有失败标记**,而不是看有没有 `did not complete` —— 后者只是崩
          # 的一种形态,实测崩得最干脆那次只剩一行 `loading test/xxx_test.dart`,
          # 按"没有 did not complete 就是真失败"会判反。真失败一定留标记:断言、未捕获
          # 异常、编译失败、或者报告器打的 `[E]` 失败行(与 PS 脚本判据一致)。
          #
          # 但"进程没了"有一句话专属于它,必须排在标记表前面查:加载期被杀时 flutter 报
          # `Failed to load "...": Connection closed before test suite loaded.`,
          # 它同时带 `Failed to load` 和 `[E]`,先查标记就会把这条 flake 当成真失败不重试。
          crashed() {
            grep -q 'did not complete' <<<"$1" && return 0
            gone='Connection closed before test suite loaded'
            grep -q "$gone" <<<"$1" && return 0
            markers='Expected:|Actual:|TestFailure|EXCEPTION CAUGHT'
            markers+='|Unhandled exception|Failed to load|\[E\]'
            ! grep -qE "$markers" <<<"$1"
          }

          for f in $(ls test/*_test.dart | sort); do
            if out=$(flutter test "$f" --concurrency=2 2>&1); then
              continue
            fi
            echo "$out"
            if ! crashed "$out"; then
              echo "::error file=$f::$f 断言/异常失败(不重试)"
              fail=1
              continue
            fi
            echo "::warning file=$f::tester 崩溃,重试一次"
            if ! out=$(flutter test "$f" --concurrency=2 2>&1); then
              echo "$out"
              echo "::error file=$f::$f 两次都失败"
              fail=1
            fi
          done
          exit $fail

      # gradlew / gradle-wrapper.jar / local.properties 都不进版本库(Flutter 模板的
      # android/.gitignore 忽略了它们),干净检出里一个都没有 —— 直接跑 ./gradlew 会
      # 报 "No such file or directory"。先让它跑一次 Android 构建,把这些补齐,
      # 顺带把 Kotlin 编译这道门也过了。
      - run: flutter build apk --debug

      # Native side: pure-function tests over DownloadNames / LaunchActivities
      # / NativeDownloader.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android

  # 覆盖率:**只做参考,不作门**。
  #
  # 为什么不做门:这个数字两个方向都证不了 —— Widget 渲染天然难覆盖,而堆行数只要多
  # 写几条不痛不痒的用例就行。它的用处是回答“哪些分支没人走过”,那是给人看的问题,
  # 不是给 CI 判的问题。所以整个 job 是 continue-on-error:红了不拦合并,结论写进
  # job summary,lcov 留成产物。
  #
  # 跑法上唯一要注意的:覆盖率得**一次跑完**才有全局数字,所以这里没用 test job 那套
  # 逐文件逻辑。代价是整套再跑一遍 —— 这也是它单开一个 job 的原因:不拖慢测试那条主线。
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: cp lib/secrets.example.dart lib/secrets.dart
      - run: flutter pub get

      - name: flutter test --coverage(整套一次)
        run: flutter test --coverage
        continue-on-error: true

      # 跑挂了也要把话说清楚:没有 lcov 是“没数”,不是“0% 覆盖”。
      - name: 覆盖率摘要(参考用,不作门)
        if: always()
        run: |
          lcov=coverage/lcov.info
          summary="$GITHUB_STEP_SUMMARY"
          if [ ! -f "$lcov" ]; then
            echo "这轮没产出 lcov,没有摘要。" >> "$summary"
            exit 0
          fi
          python3 tool/coverage_summary.py "$lcov" | tee -a "$summary"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
