name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # lib/secrets.dart is gitignored, and the app does not compile without it.
      # The template is enough here: the tests stub the network, and no real key is needed.
      - run: cp lib/secrets.example.dart lib/secrets.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Native side: pure-function tests over DownloadNames / LaunchActivities / NativeDownloader.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
