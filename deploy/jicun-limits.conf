limit_req_zone $binary_remote_addr zone=jicun_parse:10m rate=10r/m;

# APP 上报优选 IP 的限流。上报是「发完不管」的小请求,但端点开在公网,
# 得有个闸门 —— 正常每次启动最多一发,30r/m 足够宽松。
limit_req_zone $binary_remote_addr zone=jicun_cfip:10m rate=30r/m;

# 预热日志(/ping)的格式。
#
# log_format 只能写在 http 段里,而 conf.d/*.conf 正好就是 http 段,
# 所以跟限流配置挤在同一个文件里 —— 它们都属于「即存反代的 http 级配置」。
#
# 记 CF-RAY 是为了知道请求落在 Cloudflare 哪个边缘节点上:它最后一段就是机场三字码,
# 例如 a3c855d978561c98-AMS。优选 IP 到底有没有把边缘换掉,全看这一列。
log_format jicun_ping '$remote_addr - [$time_iso8601] "$request" $status cf_ray=$http_cf_ray "$http_user_agent"';

# APP 上报优选 IP 的日志格式。这份日志会被 deploy/jicun-cfip.sh 聚合,
# 所以 ip=/ms= 这两个字段名是那个脚本的输入契约,改这里要同步改那边。
#
# 这里**不**记 CF-RAY:上报本身走的是 APP 的系统 DNS(独立 client,故意不走优选 IP),
# 所以它的边缘节点跟「被上报的那个 IP 落在哪个边缘」毫无关系 ——
# 记下来只会让人误判成「这个 IP 走的是 AMS」。
log_format jicun_cfip '$remote_addr - [$time_iso8601] ip=$arg_ip ms=$arg_ms';
