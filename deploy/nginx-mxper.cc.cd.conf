server {
    server_name mxper.cc.cd;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    # 优选 IP 下发。文件由 deploy/jicun-cfip.sh 每 10 分钟重写一次,
    # 这里只是把它当静态文件吐出去 —— nginx 不参与任何计算,改列表不用 reload。
    #
    # 文件不存在时给 404:APP 那边收到 404 就继续用内置池,不会把自己搞空。
    location = /ips.json {
        root /var/www/jicun;
        default_type application/json;
        # 列表会被重写,别让 CF 或手机缓存住旧的那份。
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # APP 上报它这次赛跑赢的那个 IP(实测握手耗时)。只写日志,不做任何处理 ——
    # 聚合在 cron 里做(见 deploy/jicun-cfip.sh)。
    #
    # 之所以要客户端上报:源站在美国、到 CF 走机房直连(握手 2ms),
    # 它自己量出来的延迟对国内手机(200~350ms)没有任何参考价值。
    location = /cfip/report {
        limit_req zone=jicun_cfip burst=10 nodelay;
        limit_req_status 429;

        # 只允许 GET,别把这个入口变成通用写接口。
        limit_except GET { deny all; }

        access_log /var/log/nginx/jicun-cfip.log jicun_cfip;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # APP 的连接预热地址。
    #
    # APP 在用户点输入框时先打一发这个地址,把 DNS + TCP + TLS 的往返提前付掉。
    # 这里直接 204 掉:不回源、不计入限流,所以预热不会偷走 /parse 的配额,
    # 也不会多花第三方接口的钱。
    # exact match(=)优先于 location /,所以这个路径不会被转发到上游。
    location = /ping {
        # 单独记一个文件:每行只是一个 204,不含密钥,所以可以放心开日志 ——
        # 这是唯一能确认 APP 真的在建连接、以及落在哪个边缘节点上的地方
        # (access_log off 就再也看不见了)。
        # 格式 jicun_ping 定义在 /etc/nginx/conf.d/jicun-limits.conf。
        # /var/log/nginx/*.log 已被系统 logrotate 覆盖,不用另外配。
        access_log /var/log/nginx/jicun-ping.log jicun_ping;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # 即存 APP 的解析反代。
    #
    # APP 里只写 https://mxper.cc.cd/parse,mp- 密钥在下面这一行由 nginx 注入,
    # 不下发到客户端 —— 密钥一旦打进 APK,反编译就能拿到。
    # limit_req_zone jicun_parse 定义在 /etc/nginx/conf.d/jicun-limits.conf。
    #
    # exact match(=)优先于上面的 location /,所以网站首页、/console、/admin
    # 全部照旧走 location /,这条只影响 /parse 一个地址。
    location = /parse {
        limit_req zone=jicun_parse burst=5 nodelay;
        limit_req_status 429;

        # 只允许 GET,别把这个入口变成通用转发器。
        limit_except GET { deny all; }

        # 路径里不含变量是刻意的:
        #   带变量时 nginx 要求配 resolver,否则 reload 直接失败。
        # proxy_pass 带 URI(/api/v1/parse)时 nginx 用它替换掉匹配到的 /parse,
        # 而原始查询串 ?url=... 会自动带上 —— 上游收到 /api/v1/parse?url=...,
        # 不需要手写 $is_args$args。
        proxy_pass http://127.0.0.1:8051/api/v1/parse;

        # API Key 不写在这个文件里 —— 它在服务器上的 /etc/nginx/jicun-secret.conf,
        # 权限 600 只给 root。原因:这个文件是要进项目仓库的,密钥一旦跟着走
        # (进公开仓库、传网盘、发给别人)就等于泄露,别人能拿你的额度去刷。
        #
        # 那个文件里就一行:
        #   proxy_set_header Authorization "Bearer mp-...";
        # 换密钥时改服务器上那个文件再 reload,不用重新发版 APP。
        #
        # 注意它**不能**放 /etc/nginx/conf.d/:那个目录会被 http 段自动 include,
        # 而 proxy_set_header 在 http 段是非法的,nginx -t 直接不过。
        include /etc/nginx/jicun-secret.conf;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 解析要打第三方平台接口,给宽一点;默认 60s 会在慢链路上误杀。
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # 别把上游的错误页原样吐给 APP,Dart 侧只需要一个状态码。
        # 注意只拦 502/503/504:上游用 HTTP 400 + retdesc 表达解析失败,
        # 那个 400 必须原样透传,否则 APP 就看不到"版权限制"这类真正的原因。
        proxy_intercept_errors on;
        error_page 502 503 504 = @jicun_upstream_down;

        # 明确禁止缓存。Cloudflare 默认不缓存无扩展名的路径,但别依赖默认值 ——
        # 一旦缓存住解析结果,不同链接会串结果。
        add_header Cache-Control "no-store" always;

        # 不要把请求头写进访问日志(日志里出现密钥等于又泄露一次)。
        access_log off;
    }

    location @jicun_upstream_down {
        default_type application/json;
        return 503 '{"succ":false,"retcode":503,"retdesc":"解析服务暂时不可用,请稍后再试"}';
    }

    # ── 应用内更新的 GitHub 加速 ──
    #
    # 即存 APP 检查更新和下载 APK 都先打这里,失败才回落直连 GitHub
    # (见 lib/update_service.dart 的 kMirrorBase)。国内直连 GitHub 经常只有几 KB/s
    # 甚至连不上,走这台机器中转是唯一能让更新可用的办法。
    #
    # 两条路径必须和 APP 里的常量对得上,否则 APP 会静默回落直连:
    #   /github/releases/latest   → api.github.com 的 releases/latest
    #   /github/dl/<tag>/<asset>  → github.com 的 releases/download
    #
    # resolver + proxy_pass 里带 $变量是必须的:api.github.com / github.com 都在
    # Cloudflare 后面,IP 会变,而 nginx 只在启动时解析一次静态 upstream。这两个
    # 域名的解析结果要在运行期刷新,所以显式指定 DNS 并把结果缓存 5 分钟。
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    location = /github/releases/latest {
        # 查版本是高频轻请求(每次启动一发),单独限流,别和解析抢配额。
        limit_req zone=jicun_parse burst=10 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        # proxy_pass 里带变量时 nginx 要求显式 resolver(上面那行),而且**不会**
        # 再拼 location 匹配到的那段 URI —— 所以这里要把完整地址写全。
        # `?` 结尾是有意的:更新接口不需要查询串。
        proxy_pass https://api.github.com/repos/dhvbjvvb/jicun/releases/latest?;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "jicun-app";
        proxy_set_header Accept "application/vnd.github+json";
        # 走 https 上游必须开 SNI,否则 GitHub 直接断连。
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # 版本随时会变,别让 CF 或边缘缓存住旧结果。
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/github/dl/(?<gh_tag>[^/]+)/(?<gh_asset>[^/]+)$ {
        limit_except GET { deny all; }
        limit_req zone=jicun_parse burst=5 nodelay;
        limit_req_status 429;

        proxy_pass https://github.com/dhvbjvvb/jicun/releases/download/$gh_tag/$gh_asset;
        proxy_set_header Host github.com;
        proxy_set_header User-Agent "jicun-app";
        # GitHub 的资源地址会 302 到 objects.githubusercontent.com,让 nginx 自己跟,
        # 别把跳转丢给手机 —— 手机再跳一次又要重新握手,国内多半就跳失败了。
        proxy_redirect off;
        proxy_ssl_server_name on;
        # 这个 302 的响应头比 nginx 默认缓冲区大得多(实测报 "upstream sent too big
        # header",直接 502)。不是猜的:那个响应里带着 CSP、一大串 Vary、Set-Cookie
        # 和一大堆 X-GitHub-* 头,默认 proxy_buffer_size 4k / proxy_buffers 8×4k 装不下。
        # 调到 16k/8×16k 后实测 200。
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        # APK 有几十 MB,读超时按一条慢链路给足;默认 60s 会在国内慢速下截断。
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # 边下边吐:APK 没必要先全缓到磁盘再发,那样用户要等两倍时间。
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mxper.cc.cd/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mxper.cc.cd/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mxper.cc.cd) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mxper.cc.cd;
    return 404; # managed by Certbot


}
